name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install 

      - name: Typecheck & Lint
        run: bun run lint

      - name: Run Unit Tests
        run: bun run test

      - name: Build Application
        run: bun run build
        env:
          NODE_ENV: production